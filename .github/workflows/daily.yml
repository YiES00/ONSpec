# 일일 갱신 파이프라인 — 계획서 §4.3 (KST 03:00 크롤 시작 = UTC 18:00)
# 저비용 운영안: GitHub Actions 크론 + 정적 사이트 배포(Pages).
# 규모 확장 시 Airflow + Supabase/PostgreSQL 경로로 이전 (README '기술 스택').
name: daily-update

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 KST 03:00
  workflow_dispatch: {}     # 수동 실행

permissions:
  contents: write   # 수집 아카이브 커밋(가격 시계열 축적)
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onspec   # 저장소 루트가 아닌 onspec/ 이 프로젝트 루트
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 파이프라인 실행 (수집→추출→검증→적재→내보내기)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # LLM 추출기(운영)
        # 실수집 모드: T-Motor Store(S1) + DrUAV(S2). 픽스처 검증은 --fixtures
        run: python pipeline/run_daily.py
      - name: 수집 아카이브 커밋 (원칙 1: 원문 보존 + 가격 시계열 축적)
        # 파이프라인 직후 커밋 — 이후 단계가 실패해도 당일 수집분은 보존된다.
        # 같은 날 재실행 시 동일 파일이 덮어써지므로 변경 없으면 커밋 생략.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/collected/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "일일 수집 아카이브 $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: 플래그 리뷰 알림 (KST 06:00 목표)
        run: |
          python - << 'EOF'
          import sqlite3
          c = sqlite3.connect('db/drone_cots.sqlite3')
          n = c.execute("SELECT COUNT(*) FROM verification_log WHERE verdict IN ('flag','error')").fetchone()[0]
          print(f"::notice::리뷰 대기 플래그 {n}건 — 사람 리뷰 큐 확인 필요")
          EOF
      - name: 사이트 빌드
        run: python site/generate.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: onspec/site/dist }

  # Pages 배포는 옵트인: 저장소가 공개(또는 유료 플랜)로 전환돼 Pages를 켠 뒤
  # 저장소 변수 DEPLOY_PAGES=true 를 설정하면 활성화된다. 미설정 시 스킵(빌드는 성공).
  deploy:
    needs: build
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
