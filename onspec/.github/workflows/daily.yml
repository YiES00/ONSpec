# 일일 갱신 파이프라인 — 계획서 §4.3 (KST 03:00 크롤 시작 = UTC 18:00)
# 저비용 운영안: GitHub Actions 크론 + 정적 사이트 배포(Pages).
# 규모 확장 시 Airflow + Supabase/PostgreSQL 경로로 이전 (README '기술 스택').
name: daily-update

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 KST 03:00
  workflow_dispatch: {}     # 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 파이프라인 실행 (수집→추출→검증→적재→내보내기)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # LLM 추출기(운영)
        # 운영 커넥터 연동 전까지는 픽스처 모드로 빌드 검증
        run: python pipeline/run_daily.py --fixtures
      - name: 플래그 리뷰 알림 (KST 06:00 목표)
        run: |
          python - << 'EOF'
          import sqlite3
          c = sqlite3.connect('db/drone_cots.sqlite3')
          n = c.execute("SELECT COUNT(*) FROM verification_log WHERE verdict IN ('flag','error')").fetchone()[0]
          print(f"::notice::리뷰 대기 플래그 {n}건 — 사람 리뷰 큐 확인 필요")
          EOF
      - name: 사이트 빌드
        run: python site/generate.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
